[package]
name = "salp-rs"
crate-type = ["cdylib", "rlib"]
version = "0.1.0"
edition = "2024"

[dependencies]
pdbtbx = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.11", features = ["blocking", "json", "native-tls"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
