[package]
name = "salp-rs"
crate-type = ["cdylib", "rlib"]
version = "0.1.55"
edition = "2024"

[dependencies]
pdbtbx = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
pyo3 = { version = "0.27", features = ["extension-module"] }
